plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.alabtal.live'
    compileSdk 36

    defaultConfig {
        applicationId 'com.alabtal.live'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
    }
}
