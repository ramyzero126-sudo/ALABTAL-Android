name: Build ALABTAL Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/alabtal_v2/**'
      - 'app/src/main/java/**'
      - 'app/src/main/python/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        run: /tmp/gradle-8.13/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALABTAL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
